[package]
name = "attractor-shell"
description = "Platform-neutral screen saver shell pieces: settings, selection, input and self-test."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
attractor-core = { path = "../attractor-core" }
attractor-gpu = { path = "../attractor-gpu" }
attractor-player = { path = "../attractor-player" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
