name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run unit tests
        working-directory: Core
        run: swift test

      - name: Build core
        working-directory: Core
        run: swift build

  packages:
    name: Render and Demo build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build render layer
        working-directory: Render
        run: swift build

      - name: Build demo app
        working-directory: Demo
        run: swift build

  catalog:
    name: Catalog validation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Bundled-attractor tests share the Core suite, but calling this out keeps
      # a broken attractors.json visible as its own red check.
      - name: Validate bundled catalog
        working-directory: Core
        run: swift test --filter AttractorCatalogValidationTests
