			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "set -euo pipefail\n\nRUST_DIR=\"$SRCROOT/../rust\"\nif [ -d \"$RUST_DIR/.toolchain/cargo\" ]; then\n  export CARGO_HOME=\"$RUST_DIR/.toolchain/cargo\"\n  export RUSTUP_HOME=\"$RUST_DIR/.toolchain/rustup\"\nfi\nfind_tool() {\n  local tool=\"$1\"\n  if command -v \"$tool\" >/dev/null 2>&1; then\n    command -v \"$tool\"\n    return\n  fi\n  for candidate in \"$HOME/.cargo/bin/$tool\" \"/opt/homebrew/bin/$tool\" \"/usr/local/bin/$tool\"; do\n    if [ -x \"$candidate\" ]; then\n      echo \"$candidate\"\n      return\n    fi\n  done\n}\nCARGO=\"${CARGO:-$(find_tool cargo)}\"\nRUSTC=\"${RUSTC:-$(find_tool rustc)}\"\nif [ -z \"$CARGO\" ] || [ -z \"$RUSTC\" ]; then\n  echo \"error: the Rust toolchain was not found; install Rust or set CARGO and RUSTC\" >&2\n  exit 1\nfi\n\nlibraries=()\nfor arch in $ARCHS; do\n  case \"$arch\" in\n    arm64) rust_target=\"aarch64-apple-darwin\" ;;\n    x86_64) rust_target=\"x86_64-apple-darwin\" ;;\n    *)\n      echo \"error: unsupported architecture '$arch'\" >&2\n      exit 1\n      ;;\n  esac\n  lib_dir=$(\"$RUSTC\" --print target-libdir --target \"$rust_target\" 2>/dev/null || true)\n  if [ -z \"$lib_dir\" ] || [ ! -d \"$lib_dir\" ]; then\n    echo \"error: the Rust standard library for $rust_target is missing;\" >&2\n    echo \"       run 'rustup target add $rust_target' or build with ARCHS=$NATIVE_ARCH\" >&2\n    exit 1\n  fi\n  \"$CARGO\" build --manifest-path \"$RUST_DIR/Cargo.toml\" --locked --release \\\n    -p attractor-ffi --target \"$rust_target\"\n  libraries+=(\"$RUST_DIR/target/$rust_target/release/libattractor_ffi.a\")\ndone\n\nif [ \"${#libraries[@]}\" -eq 1 ]; then\n  cp \"${libraries[0]}\" \"$BUILT_PRODUCTS_DIR/libattractor_ffi.a\"\nelse\n  xcrun lipo -create \"${libraries[@]}\" -output \"$BUILT_PRODUCTS_DIR/libattractor_ffi.a\"\nfi\n";
		};
